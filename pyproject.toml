[project]
name = "tincan-iris"
version = "0.0.1"
description = "Iris — a local-first voice-agent brain that rides tincan."
requires-python = ">=3.11"
# The brain + voice loop are zero-dependency (stdlib urllib -> local llama-server;
# TTS/STT shell out to espeak-ng / Kokoro / faster-whisper, each in its own venv).
# The operator console (TUI) is the one optional dependency — install the
# `console` extra (Textual) for `python -m iris.console`.
dependencies = []

[project.optional-dependencies]
console = ["textual>=8"]

[project.scripts]
iris-chat = "iris.cli:main"
iris-speak = "iris.voice:main"
iris-listen = "iris.listen:main"
iris-console = "iris.console.app:main"
iris-home = "iris.console.home:main"
iris-arm = "iris.console.arm:arm_main"
iris-disarm = "iris.console.arm:disarm_main"
iris-auth = "iris.auth:main"
iris-email-check = "iris.email_check:main"
iris-install-services = "iris.services._cli:main"
iris-whisper-server = "iris._whisper_server:main"
iris-kokoro-server = "iris._kokoro_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iris*"]
