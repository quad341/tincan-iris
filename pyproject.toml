[project]
name = "tincan-iris"
version = "0.0.1"
description = "Iris — a local-first voice-agent brain that rides tincan."
requires-python = ">=3.11"
# The brain + voice loop lean on stdlib (urllib -> local llama-server; TTS/STT
# shell out to espeak-ng / Kokoro / faster-whisper in their own venvs). Deps for
# on-by-default features live in `dependencies` (a default `pip install -e .`
# ships a working product); only genuinely-optional/heavy things are extras.
dependencies = [
    # L1 Call Card capture (deterministic, on by default) — core, not an extra,
    # so capture is never silently off because an opt-in extra was skipped.
    "phonenumbers>=8.13",
    "dateparser>=1.2",
]

[project.optional-dependencies]
console = ["textual>=8"]
# L3 post-call enrichment: an OPTIONAL cloud LLM pass. L1 capture works without
# it; when absent, the daemon logs a warning and skips enrichment (never silent).
call-card = [
    "instructor[anthropic]>=1.0",
]

[project.scripts]
iris = "iris.__main__:main"
iris-chat = "iris.cli:main"
iris-speak = "iris.voice:main"
iris-listen = "iris.listen:main"
iris-console = "iris.console.app:main"
iris-home = "iris.console.home:main"
iris-arm = "iris.console.arm:arm_main"
iris-disarm = "iris.console.arm:disarm_main"
iris-auth = "iris.auth:main"
iris-email-check = "iris.email_check:main"
iris-install-services = "iris.services._cli:main"
iris-whisper-server = "iris._whisper_server:main"
iris-kokoro-server = "iris._kokoro_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iris*"]

[tool.ruff.lint]
# Deliberate resolution to ruff 0.16.0's new default rules (615 violations
# surfaced on upgrade -- see ti-mi5wk). Every entry here was individually
# triaged, not blanket-suppressed; see the bead notes for the full breakdown.
ignore = [
    # Broad `except Exception` — deliberate "keep the daemon alive" resilience
    # pattern for a live-call voice agent. All ~35 sites log, surface, or
    # return an individually-justified benign fallback (reviewed in full).
    "BLE001",
    # try/except/pass — same resilience pattern as BLE001 above (distinct rule
    # code, same sites for the most part); each pass is individually justified
    # (rollback cleanup before re-raise, opportunistic parsing, best-effort
    # UI, expected test-teardown races), reviewed in full, not sampled.
    "S110",
    # open()/tempfile without a context manager — sites are the standard
    # NamedTemporaryFile(delete=False) cross-process-handoff idiom, or handles
    # that intentionally outlive the opening scope (session log, crash-safe
    # PID lock).
    "SIM115",
    # Naive datetime construction — single-machine local voice-agent
    # daemon+CLI, no cross-timezone persistence anywhere. Local-wall-clock
    # semantics are correct at every site (DND-until parsing, session
    # timestamps, best-effort email-date humanization).
    "DTZ001",
    "DTZ005",
    "DTZ006",
    "DTZ011",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    # Unused tuple-unpack members are a deliberate convention — self-
    # documenting field names at call sites, not dead code.
    "RUF059",
    # Nested `with` blocks read more clearly un-merged in test setup; purely
    # cosmetic, no autofix implemented.
    "SIM117",
]
