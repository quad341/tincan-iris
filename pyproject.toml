[project]
name = "tincan-iris"
version = "0.0.1"
description = "Iris — a local-first voice-agent brain that rides tincan."
requires-python = ">=3.11"
# v0 brain is zero-dependency (stdlib urllib -> local llama-server). The voice
# mode shells out to espeak-ng / Kokoro (TTS) and pw-cat/aplay (playback). Kokoro
# runs in a separate 3.12 venv (scripts/setup_kokoro.sh); whisper.cpp (mic/STT)
# is still to come.
dependencies = []

[project.scripts]
iris-chat = "iris.cli:main"
iris-speak = "iris.voice:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iris*"]
