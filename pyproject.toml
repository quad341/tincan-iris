[project]
name = "tincan-iris"
version = "0.0.1"
description = "Iris — a local-first voice-agent brain that rides tincan."
requires-python = ">=3.11"
# The brain + voice loop lean on stdlib (urllib -> local llama-server; TTS/STT
# shell out to espeak-ng / Kokoro / faster-whisper in their own venvs). Deps for
# on-by-default features live in `dependencies` (a default `pip install -e .`
# ships a working product); only genuinely-optional/heavy things are extras.
dependencies = [
    # L1 Call Card capture (deterministic, on by default) — core, not an extra,
    # so capture is never silently off because an opt-in extra was skipped.
    "phonenumbers>=8.13",
    "dateparser>=1.2",
]

[project.optional-dependencies]
console = ["textual>=8"]
# L3 post-call enrichment: an OPTIONAL cloud LLM pass, driven through a warm
# ClaudeTuiSession (vendor Claude Code TUI) rather than a raw API key — see
# docs/adr/0001. L1 capture works without it; when pydantic is absent, the
# daemon logs a warning and skips enrichment (never silent).
call-card = [
    "pydantic>=2",
]

[project.scripts]
iris = "iris.__main__:main"
iris-chat = "iris.cli:main"
iris-speak = "iris.voice:main"
iris-listen = "iris.listen:main"
iris-console = "iris.console.app:main"
iris-home = "iris.console.home:main"
iris-arm = "iris.console.arm:arm_main"
iris-disarm = "iris.console.arm:disarm_main"
iris-auth = "iris.auth:main"
iris-email-check = "iris.email_check:main"
iris-install-services = "iris.services._cli:main"
iris-whisper-server = "iris._whisper_server:main"
iris-kokoro-server = "iris._kokoro_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["iris*"]
