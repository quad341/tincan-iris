name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Off the hour so this repo's tick doesn't land on GitHub's scheduler at
    # the same instant as every other repo running "every 6 hours." Forces
    # re-evaluation of main's already-merged tip so drift (e.g. a new ruff
    # release breaking `ruff check .` with zero commits of ours) can't stay
    # silently green for days — see ti-pcqj4 / ti-4tq52.
    - cron: "17 */6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        # ruff pinned to 0.15.22: ruff 0.16.0 (released 2026-07-23) turned on
        # new default lint rules that flag ~615 pre-existing sites across the
        # codebase, breaking CI repo-wide with no code change of ours (see
        # ti-7z1kj). This is an emergency stopgap, NOT a permanent decision --
        # triage (fix-and-unpin vs. adopt 0.16.0 deliberately vs. pin
        # long-term) is tracked in ti-mi5wk. Do not casually bump/remove this
        # pin without resolving that bead first.
        run: pip install -e '.[console,call-card]' pytest 'ruff==0.15.22'
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
