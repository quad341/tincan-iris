name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Off the hour so this repo's tick doesn't land on GitHub's scheduler at
    # the same instant as every other repo running "every 6 hours." Forces
    # re-evaluation of main's already-merged tip so drift (e.g. a new ruff
    # release breaking `ruff check .` with zero commits of ours) can't stay
    # silently green for days — see ti-pcqj4 / ti-4tq52.
    - cron: "17 */6 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ruff-policy: adopt-deliberately -- 615 sites from 0.16.0's new default
      # rules were triaged individually (not blanket-suppressed): genuine
      # issues fixed, deliberate patterns kept via pyproject.toml
      # [tool.ruff.lint] ignores / targeted noqa. Left unpinned so CI always
      # lints against current ruff -- see ti-mi5wk for the full breakdown.
      # Supersedes ti-7z1kj's emergency ruff==0.15.22 stopgap pin, which is
      # deliberately resolved (not just re-triggered) by this triage.
      - name: Install package + test deps
        run: pip install -e '.[console,call-card]' pytest ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
