name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + test deps
        run: pip install -e '.[console,call-card]' pytest ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest -q
